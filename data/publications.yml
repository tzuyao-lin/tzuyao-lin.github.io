- id: lin-2026-single-item
  status: published
  year: 2026
  date: 2026-07-09
  authors: "Lin, T.-Y., Tuerlinckx, F., & Vanbelle, S."
  title: "Single-Item Reliability for Intensive Longitudinal Data: A Three-Level Linear Mixed-Effect Autoregressive Modeling Approach"
  venue: "Psychometrika"
  doi: "10.1017/psy.2026.10133"
  abstract: |
    With the advancement of technology, intensive longitudinal data are increasingly collected to study dynamic psychological and physiological processes. This article introduces a three-level linear mixed-effects model that accounts for moments nested within days within persons and incorporates moment- and day-level autoregressive processes. The framework distinguishes between-person and within-person reliability and assesses measurement agreement across different time scales.
  apa: "Lin, T.-Y., Tuerlinckx, F., & Vanbelle, S. (2026). Single-item reliability for intensive longitudinal data: A three-level linear mixed-effect autoregressive modeling approach. Psychometrika. https://doi.org/10.1017/psy.2026.10133"
