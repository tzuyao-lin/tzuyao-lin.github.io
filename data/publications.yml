- id: lin-hsu-2026-gclk
  status: published
  year: 2026
  authors: "Lin, T.-Y., & Hsu, Y.-F."
  title: "Incorporating the Luce–Krantz threshold model into cultural consensus theory for ordinal categorical data"
  venue: "Journal of Mathematical Psychology"
  doi: "10.1016/j.jmp.2026.102990"
  abstract: |
    Cultural consensus theory traditionally models dichotomous responses when the culturally correct answers are unknown. This study extends the general Condorcet model with Luce–Krantz threshold theory so that respondents can express varying confidence through ordinal categories. The resulting hierarchical Bayesian model estimates consensus truths, item difficulty, informant competence, guessing bias, and the number of latent cultures.
  apa: "Lin, T.-Y., & Hsu, Y.-F. (2026). Incorporating the Luce–Krantz threshold model into cultural consensus theory for ordinal categorical data. Journal of Mathematical Psychology. https://doi.org/10.1016/j.jmp.2026.102990"
