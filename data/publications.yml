      doi = {10.1037/met0000738}
    }

- id: yu-etal-2025-perceptual
  status: published
  year: 2025
  authors: "Yu, K., Lin, T.-Y., Zaman, J., Tuerlinckx, F., & Vanhasbroeck, N."
  title: "Consistency of perceptual response variability in size estimation and reproduction tasks"
  venue: "Behavior Research Methods, 57(5), 127"
  doi: "10.3758/s13428-025-02650-1"
  abstract: |
    This study compared visual analog scale estimation and reproduction tasks as measures of perceptual uncertainty. Across 180 participants, both tasks produced consistent overall measures, while multilevel variance decomposition and psychophysical modeling revealed systematic task-specific differences in how perceptual variability was expressed.
  apa: "Yu, K., Lin, T.-Y., Zaman, J., Tuerlinckx, F., & Vanhasbroeck, N. (2025). Consistency of perceptual response variability in size estimation and reproduction tasks. Behavior Research Methods, 57(5), 127. https://doi.org/10.3758/s13428-025-02650-1"
