    }

- id: lo-etal-2025-vaccine
  status: published
  year: 2025
  authors: "Lo, C., Lin, T.-Y., Werneck, G. L., Domingues, C., Saavedra, R. da C., Moore, M., Souza, L. E. P. F., Regazzi, L., & Lomazzi, M."
  title: "The impact of the COVID-19 pandemic on vaccine sentiment among Brazilian healthcare workers: A cross-sectional online survey study"
  venue: "Journal of Global Health Economics and Policy, 5, e2025034"
  doi: "10.7189/001c.144190"
  post: "posts/20250328_VHS/"
  abstract: |
    This cross-sectional online survey examined vaccine sentiment among 634 Brazilian healthcare workers. Vaccine hesitancy was uncommon and overall sentiment was positive. Trust in institutional websites was associated with more positive vaccine sentiment, while obligated collective responsibility emerged as a useful extension of the 5C model.
  apa: "Lo, C., Lin, T.-Y., Werneck, G. L., Domingues, C., Saavedra, R. da C., Moore, M., Souza, L. E. P. F., Regazzi, L., & Lomazzi, M. (2025). The impact of the COVID-19 pandemic on vaccine sentiment among Brazilian healthcare workers: A cross-sectional online survey study. Journal of Global Health Economics and Policy, 5, e2025034. https://doi.org/10.7189/001c.144190"
