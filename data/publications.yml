- id: rao-etal-2025-coffee
  status: published
  year: 2025
  authors: "Rao, Y., Yu, E. Y.-W., Lin, T.-Y., Chen, Y., Qin, Y., Koster, A., Eussen, S. J. P. M., Bosma, H., Berendschot, T. J. M., van der Kallen, C., van Greevenbroek, M., de Galan, B., Zeegers, M., & Wesselius, A."
  title: "Interaction between coffee consumption and polygenic risk score in relation to diabetes: Insights from The Maastricht Study"
  venue: "European Journal of Nutrition, 64, 263"
  doi: "10.1007/s00394-025-03782-y"
  post: "posts/20240918_CDP/"
  abstract: |
    This study investigated the associations of polygenic risk score and habitual coffee consumption with prediabetes and type 2 diabetes among 7,668 participants in the southern Netherlands. No significant interaction between genetic risk and coffee consumption was observed. Coffee consumption showed a potentially U-shaped association with the prevalence of both conditions.
