project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "posts/"
    - cv/academic-cv.qmd

execute:
  freeze: true

website:
  title: "Tzu-Yao Lin"
  site-url: https://tzuyao-lin.github.io/
  description: "Research, statistics, and R by Tzu-Yao Lin"
  favicon: assets/images/favicon.svg
  open-graph: true
  twitter-card:
    card-style: summary
  #google-analytics: ""
  navbar:
    left:
      - href: about.qmd
        text: "About Me"
      - href: blog.qmd
        text: "Posts"
      - href: publication.qmd
        text: "Research"
    right:
      - icon: github
        href: https://github.com/tzuyao-lin
format:
  html:
    lang: en
    theme: 
      light: flatly
      dark: darkly
    css: styles.css

editor: source
